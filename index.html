<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FST - Field Support Technicians</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- ============================================================ -->
<!-- APP CONTAINER -->
<!-- ============================================================ -->
<div id="app">

<!-- ============================================================ -->
<!-- LOGIN SCREEN -->
<!-- ============================================================ -->
<div id="screen-login" class="screen active">
  <div class="login-container">
    <div class="login-logo">
      <img src="https://www.kginvicta.com/wp-content/uploads/2021/03/KG-Invicta-Logo.png"
           alt="KG Invicta" onerror="this.style.display='none'; document.getElementById('logo-text').style.display='block'">
      <div id="logo-text" style="display:none" class="logo-text-fallback">KG INVICTA</div>
    </div>
    <div class="login-app-name">
      <span class="fst-title">FST</span>
      <span class="fst-subtitle">Field Support Technicians</span>
    </div>
    <div class="login-card">
      <div class="form-group">
        <label><i class="fas fa-users"></i> Login As</label>
        <select id="login-role" class="form-control">
          <option value="">-- Select Role --</option>
          <option value="Admin">Admin</option>
          <option value="Manager">Manager</option>
          <option value="Field Engineer">Field Engineer</option>
        </select>
      </div>
      <div class="form-group">
        <label><i class="fas fa-user"></i> Username</label>
        <input type="text" id="login-username" class="form-control" placeholder="Enter username">
      </div>
      <div class="form-group">
        <label><i class="fas fa-lock"></i> Password</label>
        <div class="password-wrap">
          <input type="password" id="login-password" class="form-control" placeholder="Enter password">
          <button class="pwd-toggle" onclick="togglePassword()"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <div id="login-error" class="error-msg" style="display:none"></div>
      <button class="btn btn-primary btn-full" onclick="handleLogin()">
        <i class="fas fa-sign-in-alt"></i> Login
      </button>
    </div>
    <div class="login-footer">FST v1.0 &copy; KG Invicta</div>
  </div>
</div>

<!-- ============================================================ -->
<!-- MAIN APP SCREEN -->
<!-- ============================================================ -->
<div id="screen-main" class="screen">

  <!-- TOP HEADER -->
  <header class="app-header">
    <button class="header-menu-btn" onclick="toggleSidebar()">
      <i class="fas fa-bars"></i>
    </button>
    <div class="header-logo">
      <img src="https://www.kginvicta.com/wp-content/uploads/2021/03/KG-Invicta-Logo.png"
           alt="KG Invicta" class="header-logo-img" onerror="this.style.display='none'">
      <span class="header-app-name">FST</span>
    </div>
    <div class="header-user" onclick="showUserProfile()">
      <div class="header-user-info">
        <span id="header-user-name" class="header-name"></span>
        <span id="header-user-role" class="header-role"></span>
      </div>
      <div class="header-avatar">
        <i class="fas fa-user-circle"></i>
      </div>
    </div>
  </header>

  <!-- SIDEBAR -->
  <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
  <nav id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-user-avatar"><i class="fas fa-user-circle"></i></div>
      <div class="sidebar-user-info">
        <div id="sidebar-user-name" class="sidebar-name"></div>
        <div id="sidebar-user-role" class="sidebar-role"></div>
        <div id="sidebar-user-city" class="sidebar-city"></div>
      </div>
    </div>
    <div id="sidebar-menu" class="sidebar-menu"></div>
    <div class="sidebar-footer">
      <button class="btn-logout" onclick="handleLogout()">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </div>
  </nav>

  <!-- PAGE CONTENT -->
  <main id="page-content" class="page-content">
    <div id="content-area"></div>
  </main>

</div>

<!-- ============================================================ -->
<!-- MODAL -->
<!-- ============================================================ -->
<div id="modal-overlay" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <div class="modal-header">
      <span id="modal-title"></span>
      <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<!-- ============================================================ -->
<!-- TOAST NOTIFICATION -->
<!-- ============================================================ -->
<div id="toast" class="toast"></div>

<!-- ============================================================ -->
<!-- LOADING OVERLAY -->
<!-- ============================================================ -->
<div id="loading" class="loading-overlay" style="display:none">
  <div class="loading-spinner">
    <div class="spinner"></div>
    <div class="loading-text">Please wait...</div>
  </div>
</div>

</div><!-- end #app -->

<script src="config.js"></script>
<script src="api.js"></script>
<script src="utils.js"></script>
<script src="auth.js"></script>
<script src="admin.js"></script>
<script src="engineer.js"></script>
<script src="manager.js"></script>
<script src="reports.js"></script>
<script src="app.js"></script>
</body>
</html>
